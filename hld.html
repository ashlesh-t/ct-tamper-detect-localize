<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <style>

<div class="diagram-wrap">

    <button class="btn-dl" onclick="downloadLogicSVG()">Download SVG</button>

        .terminator { fill: #f0fdf4; stroke: #10b981; stroke-width: 2; rx: 15; }
        .alert { fill: #fef2f2; stroke: #ef4444; stroke-width: 2; rx: 6; }
        .txt { font-size: 12px; fill: #334155; font-family: sans-serif; text-anchor: middle; }
        .txt-bold { font-weight: bold; }
        .path { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowHead); }
        .label { font-size: 10px; fill: #64748b; background: white; }
      </style>
    </defs>

    <rect x="350" y="10" width="200" height="40" class="box" />
    <text x="450" y="35" class="txt txt-bold">New Scan Inference</text>

    <rect x="350" y="80" width="200" height="50" class="process" />

    <rect x="100" y="160" width="160" height="50" class="alert" />
    <text x="180" y="180" class="txt txt-bold">Flag: Low Confidence</text>
    <text x="180" y="198" class="txt" font-size="10">Route to Manual Review</text>

    <rect x="350" y="240" width="200" height="50" class="process" />

    <text x="450" y="278" class="txt" font-size="10">Injection vs Removal</text>

    <text x="450" y="340" class="txt txt-bold">Check Ambiguity</text>

    <text x="305" y="180" class="label">No</text>

    <path d="M 450 370 L 450 390 L 580 390 L 580 420" class="path" /> <text x="530" y="405" class="label">Type: Rem</text>

    <path d="M 320 480 L 320 500 L 450 500 L 450 520" class="path" />
    <path d="M 580 480 L 580 500 L 450 500 L 450 520" class="path" />

    <path d="M 450 560 L 450 590" class="path" />

<script>
function downloadLogicSVG(){
  const svg = document.getElementById('logicSvg');
  const serializer = new XMLSerializer();
  let source = serializer.serializeToString(svg);
  if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
    source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
  }
  const blob = new Blob([source], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inference_logic_flow.svg';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
</script>
</body>
</html>
